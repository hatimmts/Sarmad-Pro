<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاتصال بالشبكة — سرمد</title>
<link rel="stylesheet" href="style.css">
<style>
.hero{background:#1e293b;padding:40px;border-radius:20px}
.bigbtn{display:block;margin:20px auto;padding:16px 28px;
background:#16a34a;color:#fff;font-size:20px;
border-radius:14px;text-decoration:none;width:fit-content}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:30px}
.card{background:#0f172a;padding:18px;border-radius:14px;border:1px solid #334155}
.stat{font-size:22px;margin-top:6px}
.btn{display:inline-block;margin:6px;padding:10px 16px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none}
</style>
</head>

<body>
<div class="container">

<h1>🚀 الانضمام إلى شبكة سرمد</h1>

<div class="hero">
  <p>اتصل بالشبكة الرئيسية بضغطة واحدة</p>
  <a class="bigbtn" id="btnWebNode" href="http://78.47.21.219:9334/node.html">اتصال فوري بالشبكة</a>
</div>

<div class="grid">
  <div class="card">
    <div>حالة الشبكة</div>
    <div class="stat" id="netStatus">…</div>
  </div>
  <div class="card">
    <div>البلوك الحالي</div>
    <div class="stat" id="chainHeight">—</div>
  </div>
  <div class="card">
    <div>العقد المتصلة</div>
    <div class="stat" id="activeCount">—</div>
  </div>
</div>

<div style="margin-top:30px">
  <a class="btn" href="sarmad://install">📱 فتح التطبيق</a>
  <a class="btn" id="btnDownload" href="downloads/SRMD.apk" download>⬇️ تحميل التطبيق</a>
  <a class="btn" href="#" id="btnCopyInvite">🔗 نسخ رابط الدعوة</a>
</div>

<div style="margin-top:40px">
  <a href="index.html">⬅ العودة للرئيسية</a>
</div>

</div>
<script>
  // Live stats from VPS coordinator (appearance unchanged; numbers only).
  var STATUS_URL = "http://78.47.21.219:9334/v1/status";
  var elStatus = document.getElementById("netStatus");
  var elHeight = document.getElementById("chainHeight");
  var elActive = document.getElementById("activeCount");

  function refreshStatus() {
    fetch(STATUS_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("bad status");
        return res.json();
      })
      .then(function (data) {
        elStatus.textContent = "🟢 تعمل";
        elHeight.textContent = "#" + String(data.chainHeight != null ? data.chainHeight : 0);
        var n = data.activeCount != null ? data.activeCount : 0;
        elActive.textContent = n + " عقدة";
      })
      .catch(function () {
        elStatus.textContent = "🔴 غير متصل";
        elHeight.textContent = "—";
        elActive.textContent = "—";
      });
  }

  refreshStatus();
  setInterval(refreshStatus, 4000);

    var params = new URLSearchParams(window.location.search);
  var inviter = (params.get("inviter") || "").trim();
  var deepLink = inviter ? ("sarmad://install?inviter=" + encodeURIComponent(inviter)) : "sarmad://install";
  var webNode = "http://78.47.21.219:9334/node.html" + (inviter ? ("?inviter=" + encodeURIComponent(inviter)) : "");
  var inviteLink = inviter ? ("https://sarmad.pro/mining.html?inviter=" + encodeURIComponent(inviter)) : "https://sarmad.pro/mining.html";
  var btnConnect = document.getElementById("btnWebNode") || document.querySelector(".bigbtn");
  var btnOpen = document.querySelectorAll(".btn")[0];
  if (btnConnect) btnConnect.href = webNode;
  if (btnOpen) btnOpen.href = deepLink;
  document.getElementById("btnCopyInvite").addEventListener("click", function (e) {
    e.preventDefault();
    var link = inviteLink;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () {
        alert("تم نسخ الرابط");
      }).catch(function () {
        prompt("انسخ الرابط:", link);
      });
    } else {
      prompt("انسخ الرابط:", link);
    }
  });
</script>
</body>
</html>
